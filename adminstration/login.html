<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Garba Beats — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe4;                          /* was #141110 */
    --ivory:#362820;                       /* was #f3ede2 → main text */
    --ivory-dim:#8e7c6a;                   /* was #a89e8e → dim text */
    --gold:#b9835b;                        /* was #c9a15a → rose-gold */
    --gold-light:#7a2331;                  /* was #e3c584 → deep wine, primary accent */
    --hairline:rgba(122,35,49,0.16);       /* was rgba(201,161,90,0.18) */
    --surface:rgba(255,255,255,0.55);      /* was rgba(255,250,240,0.035) */
    --surface-border:rgba(54,40,32,0.10);  /* was rgba(243,237,226,0.10) */
    --error:#a83f2e;                        /* was #c96a5a → darkened terracotta-red so it stays readable as text on cream (the old coral was tuned for a dark background) */
    --error-bg:rgba(168,63,46,0.10);        /* was rgba(201,106,90,0.08) → same coral family, slightly higher alpha so the banner wash is visible on white */
    --error-border:rgba(168,63,46,0.30);   /* was rgba(201,106,90,0.28) */
    --radius:4px;                          /* unchanged */
    --ease:cubic-bezier(.4,0,.2,1);        /* unchanged */
    }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--ivory);
    background:
      radial-gradient(700px 420px at 50% 8%, rgba(122,35,49,0.05), transparent 60%),
      var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  h1{ margin:0; }
  p{ margin:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .login-wrap{
    width:100%; max-width:380px;
    opacity:0; transform:translateY(10px);
    animation:riseIn .6s var(--ease) forwards;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  .brand{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; margin-bottom:32px;
  }
  .mark{
    width:30px; height:30px; margin-bottom:18px; opacity:.85;
  }
  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:17px; letter-spacing:.12em; color:var(--ivory);
    margin-bottom:8px;
  }
  .wordmark span{ color:var(--gold-light); }
  .admin-tag{
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ivory-dim);
    border:1px solid var(--hairline);
    padding:3px 9px; border-radius:2px;
  }

  .login-card{
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:var(--radius);
    padding:36px 32px;
  }
  @media (max-width:420px){ .login-card{ padding:30px 24px; } }

  .login-card h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:22px; color:var(--ivory);
    margin-bottom:6px;
  }
  .login-sub{
    font-size:13px; color:var(--ivory-dim); line-height:1.5;
    margin-bottom:28px;
  }

  .field{ margin-bottom:20px; }
  .field label{
    display:block;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ivory-dim);
    margin-bottom:9px;
  }
  .field input{
    width:100%;
    font-family:inherit; font-size:14px; color:var(--ivory);
    background:rgba(54,40,32,0.03);
    border:1px solid var(--surface-border);
    border-radius:var(--radius);
    padding:12px 14px;
    transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  .field input::placeholder{ color:rgba(142,124,106,0.6); }
  .field input:focus{
    outline:none; border-color:var(--gold); background:rgba(122,35,49,0.05)
  }
  .field input:focus-visible{ outline:none; }
  .field input.field-error{ border-color:var(--error); }

  .error-banner{
    display:none; align-items:center; gap:10px;
    font-size:12.5px; color:var(--error);
    background:var(--error-bg);
    border:1px solid var(--error-border);
    border-radius:var(--radius);
    padding:11px 14px;
    margin-bottom:20px;
  }
  .error-banner svg{ width:15px; height:15px; flex:0 0 auto; stroke:var(--error); }

  .submit-btn{
    width:100%;
    font-family:inherit;
    font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--bg);
    background:var(--gold-light);
    border:none; border-radius:2px;
    padding:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .3s var(--ease), transform .3s var(--ease), opacity .3s var(--ease);
  }
  .submit-btn:hover:not(:disabled){ background:var(--gold); transform:translateY(-1px); }
  .submit-btn:focus-visible{ outline:1px solid var(--gold-light); outline-offset:3px; }
  .submit-btn:disabled{ opacity:.65; cursor:default; transform:none; }

  .spinner{
    width:13px; height:13px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.35);
    border-top-color:var(--bg);
    animation:spin .7s linear infinite;
    display:none;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-text{ opacity:.85; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login-footnote{
    text-align:center;
    font-size:11.5px; color:var(--ivory-dim);
    margin-top:22px;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="#b9835b" stroke-width="1.1">
      <circle cx="20" cy="20" r="17"/>
      <path d="M20 6 L20 34 M6 20 L34 20" stroke-opacity=".5"/>
    </svg>
    <div class="wordmark">SHREE <span>GARBA</span> BEATS</div>
    <span class="admin-tag">Admin</span>
  </div>

  <div class="login-card">
    <h1>Sign in</h1>
    <p class="login-sub">Enter your credentials to access the admin dashboard.</p>

    <div class="error-banner" id="errorBanner" >
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">Incorrect username or password. Please try again.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input name="admin" placeholder="John Doe" type="text" id="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input name="password" type="password" placeholder="••••••••••" id="password" autocomplete="current-password" required>
      </div>

      <button class="submit-btn" type="submit" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Sign In</span>
      </button>
    </form>
  </div>

  <p class="login-footnote">Shree Garba Beats · The Grand Garba Night</p>
</div>

<script>
  const loginForm   = document.querySelector('#loginForm');
  const submitBtn   = document.querySelector('#submitBtn');
  const errorBanner = document.querySelector('#errorBanner');
  const errorText   = document.querySelector('#errorText');
  const usernameEl  = document.querySelector('#username');
  const passwordEl  = document.querySelector('#password');

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.classList.toggle('loading', isLoading);
  }

  function showError(message) {
    errorText.innerText = message;
    errorBanner.style.display = 'flex';
    usernameEl.classList.add('field-error');
    passwordEl.classList.add('field-error');
  }

  function clearError() {
    errorBanner.style.display = 'none';
    usernameEl.classList.remove('field-error');
    passwordEl.classList.remove('field-error');
  }

  usernameEl.addEventListener('input', clearError);
  passwordEl.addEventListener('input', clearError);

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    setLoading(true);

    const formData = new FormData(loginForm);

    try {
      const res = await fetch('https://shreegarbabeatsbackend.onrender.com/adminstration/login', {
        method: 'POST',
        credentials: 'include',
        body: formData
      });

      if (res.status == 200) {
        // window.location.href = 'dashboard.html';
      } else {
        setLoading(false);
        showError('Incorrect username or password. Please try again.');
      }
    } catch (err) {
      setLoading(false);
      showError('Could not reach the server. Please try again.');
    }
  });
</script>
</body>
</html>
